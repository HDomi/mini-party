name: Sweep idle rooms

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List idle rooms without deleting them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sweep-rooms
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # No `environment:` here, so these secrets must be repo-level (an environment would log a deployment every hour).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Node runs the .ts directly (type stripping); the script has no npm deps.
      - run: node scripts/sweep-rooms.ts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL || vars.FIREBASE_DATABASE_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}

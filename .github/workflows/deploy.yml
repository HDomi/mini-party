name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment-level secrets live on `github-pages`; repo-level secrets work too.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: |
          # Without the key the bundle would talk to a path the database rules keep closed.
          if [ -n "$VITE_FIREBASE_DATABASE_URL" ] && ! printf '%s' "$VITE_DB_KEY" | grep -Eq '^[A-Za-z0-9_-]{16,128}$'; then
            echo "::error::DB_KEY secret is missing or not 16-128 chars of A-Z a-z 0-9 _ -"
            exit 1
          fi
          npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL || vars.FIREBASE_DATABASE_URL }}
          # Inlined into the bundle, which the password gate encrypts.
          VITE_DB_KEY: ${{ secrets.DB_KEY }}
          # Build-time only: encrypts the bundle. Not VITE_-prefixed, so it is never inlined.
          PLAY_PW: ${{ secrets.PLAY_PW }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

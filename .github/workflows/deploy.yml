name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 환경 수준 secret은 `github-pages`에 둔다. 저장소 수준 secret도 동작한다.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: |
          # 키가 없으면 번들이 DB 규칙상 닫힌 경로로 접속하게 된다.
          if [ -n "$VITE_FIREBASE_DATABASE_URL" ] && ! printf '%s' "$VITE_DB_KEY" | grep -Eq '^[A-Za-z0-9_-]{16,128}$'; then
            echo "::error::DB_KEY secret is missing or not 16-128 chars of A-Z a-z 0-9 _ -"
            exit 1
          fi
          npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL || vars.FIREBASE_DATABASE_URL }}
          # 번들에 인라인되며, 그 번들은 password gate가 암호화한다.
          VITE_DB_KEY: ${{ secrets.DB_KEY }}
          # 빌드 시점 전용: 번들을 암호화한다. VITE_ 접두사가 없어 인라인되지 않는다.
          PLAY_PW: ${{ secrets.PLAY_PW }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
